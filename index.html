.wrongbook{margin-top:26px;padding:22px}.wrongbook h2{margin:0 0 6px}.wrong-empty{color:var(--muted);padding:18px 0}.wrong-item{border-top:1px solid var(--line);padding:15px 0}.wrong-item:first-of-type{border-top:0}.wrong-item strong{display:block;margin-bottom:4px}.wrong-answer{color:var(--red)}.right-answer{color:var(--green)}.jump{border:0;background:var(--blue2);color:#2344a8;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700;margin-top:7px}

<script>
const CHAPTERS = [
{
id:"floridi",area:"독서 · 인문",title:"플로리디의 정보 철학",
summary:"온라인과 오프라인의 경계 변화, 인포스피어와 인포그, 인간·기술·환경의 관계, 정보적 존재의 내재적 가치를 중심으로 묻습니다.",
source:"학교 1차 학습지의 플로리디 지문과 기존 배곧고 대비 자료를 바탕으로 재구성했습니다.",
d:[
"인포스피어는 인터넷 서버 내부의 가상 공간만을 뜻한다.",
"인포그는 다른 존재와 정보 교환 없이 자족하는 독립적 인간을 뜻한다.",
"정보 기술의 발전은 온라인과 오프라인의 경계를 더 엄격히 분리한다.",
"플로리디는 가치 판단의 대상을 인간의 의식이 있는 존재로만 한정한다.",
"기술은 인간과 세계 사이의 관계에 영향을 주지 않는 중립적 도구일 뿐이다.",
"정보적 존재의 가치는 인간에게 유용할 때에만 성립한다.",
"인공물은 어떤 경우에도 윤리적 고려의 대상이 될 수 없다.",
"인포스피어에서는 물질적 세계가 사라진다.",
"인간은 정보 환경과 무관하게 고립된 주체로 이해되어야 한다.",
"도덕적 고려는 능동적으로 행동할 수 있는 존재에게만 허용된다."
],
q:[
["윗글의 중심 생각으로 가장 적절한 것은?","정보 기술의 발전은 인간·기술·환경의 관계와 윤리의 범위를 정보적 관점에서 새롭게 이해하게 한다.","플로리디는 정보화된 생활 세계의 변화가 인간의 자기 이해와 윤리적 고려 범위를 바꾼다고 본다.","주제"],
["플로리디가 현대의 생활 세계를 인포스피어로 보는 이유로 가장 적절한 것은?","물리적 환경과 디지털 환경이 긴밀히 연결되어 정보적 상호 작용이 일상화되었기 때문이다.","인포스피어는 단순한 인터넷 공간이 아니라 온라인·오프라인이 얽힌 정보적 생활 환경을 가리킨다.","세부"],
["인포그에 대한 설명으로 적절한 것은?","인간을 다른 생물학적 행위자와 인공물에 연결된 정보적 유기체로 파악한 개념이다.","인포그 개념은 인간을 관계망 속 정보적 존재로 이해한다.","개념"],
["온라인과 오프라인의 관계에 대한 플로리디의 관점으로 적절한 것은?","두 영역의 경계가 약화되어 현실 경험을 둘로 명확히 나누기 어려워졌다고 본다.","스마트폰·클라우드 등은 물리적 삶과 디지털 정보 환경을 지속적으로 연결한다.","추론"],
["전통적 기술관과 정보 사회의 기술관을 비교한 내용으로 가장 적절한 것은?","정보 사회에서는 기술을 단순히 인간 주체가 객체를 다루는 수단으로만 보기 어렵다.","기술이 환경 구성과 상호 작용 방식 자체에 참여하므로 단순한 주체-도구 도식이 충분하지 않다.","비교"],
["다음 상황을 플로리디의 관점에서 이해한 것으로 적절한 것은?\n<보기> 한 학생의 신체는 교실에 있지만 학습 기록과 관계망은 클라우드와 온라인 플랫폼에도 지속적으로 남아 있다.","그 학생의 존재와 활동이 물리 공간과 정보 공간에 걸쳐 연결되어 있다는 사례로 볼 수 있다.","온라인·오프라인 경계의 약화를 보여 주는 사례다.","적용"],
["정보적 존재의 내재적 가치에 대한 이해로 적절한 것은?","어떤 존재를 단지 인간에게 유용한 수단으로만 평가하지 않고 그 자체의 정보적 존재성을 고려할 수 있다는 뜻이다.","내재적 가치는 도구적 효용과 구별된다.","개념"],
["플로리디의 윤리적 관점에서 강조되는 방향으로 적절한 것은?","행위 능력만이 아니라 행위의 영향을 받는 존재의 입장까지 고려 범위를 넓히는 것이다.","윤리적 고려의 초점을 능동적 행위자에만 한정하지 않는다.","윤리"],
["윗글에서 인포스피어와 인포그의 관계를 설명한 것으로 가장 적절한 것은?","인포그는 인포스피어를 구성하고 그 안에서 다른 존재들과 정보를 주고받는 존재이다.","인포그와 인포스피어는 개별 존재와 정보적 환경의 관계로 이해할 수 있다.","관계"],
["다음 중 플로리디의 관점과 가장 거리가 먼 것은?","디지털 정보는 현실과 분리된 부차적 자료이므로 인간의 존재 방식에는 본질적 영향을 주지 않는다.","플로리디는 정보 기술이 생활 세계와 인간 이해를 변화시킨다고 본다.","판단",["디지털 정보는 현실과 분리된 부차적 자료이므로 인간의 존재 방식에는 본질적 영향을 주지 않는다.","인포그는 다른 존재와 정보 교환 없이 자족하는 독립적 인간을 뜻한다.","인포스피어에서는 물질적 세계가 사라진다.","인공물은 어떤 경우에도 윤리적 고려의 대상이 될 수 없다."]],
["플로리디의 논의를 통해 추론할 수 있는 내용으로 적절한 것은?","정보 환경이 변하면 인간이 자신과 타자를 이해하는 기준도 함께 달라질 수 있다.","생활 세계의 변화가 자기 이해와 윤리적 판단 틀에 영향을 줄 수 있다.","추론"],
["<보기>의 판단 중 플로리디의 관점에 부합하는 것은?\n<보기> 자율 주행 시스템의 오류로 주변 환경과 사람에게 손해가 생겼다면 시스템과 환경의 정보적 관계까지 함께 살펴야 한다.","정보 기술을 고립된 도구가 아니라 다른 존재들과 관계를 맺는 환경의 일부로 보아야 한다.","관계적 정보 환경의 관점에서 문제를 본다.","적용"],
["인간 중심적인 가치 판단을 완화한다는 설명의 의미로 가장 적절한 것은?","인간 이외의 존재도 정보적 존재로서 일정한 윤리적 고려를 받을 가능성을 인정한다.","정보 윤리는 가치 고려의 범위를 넓히는 방향을 취한다.","윤리"],
["플로리디의 입장에서 스마트폰을 이해한 것으로 가장 적절한 것은?","인간과 정보 환경을 지속적으로 연결하며 상호 작용 방식을 바꾸는 매개로 볼 수 있다.","스마트폰은 온라인·오프라인 연결의 대표적 사례다.","적용"],
["윗글의 전개 방식으로 가장 적절한 것은?","정보 기술로 인한 환경 변화를 제시한 뒤 인간 이해와 윤리적 함의를 확장해 설명한다.","환경 변화→인간 이해→윤리적 확장의 흐름이다.","구조"],
["인포스피어 개념이 필요한 이유로 추론한 것으로 적절한 것은?","현대의 경험을 물리 세계와 온라인 세계로 분리해 설명하는 방식의 한계를 보완하기 위해서이다.","두 영역이 결합된 현실을 하나의 정보적 환경으로 설명한다.","추론"],
["다음 진술의 전제가 되는 생각으로 적절한 것은?\n‘정보적 구조로 분석될 수 있는 존재는 그 자체의 가치를 고려할 수 있다.’","가치 판단의 기준을 인간의 의식이나 효용에만 한정할 필요는 없다는 생각이다.","내재적 가치 논의는 인간 중심 기준을 넘어선다.","추론"],
["플로리디가 인간을 인포그로 설명할 때 약화되는 관점은?","인간을 환경과 분리된 완전히 독립적인 주체로 보는 관점이다.","인포그는 상호 연결성을 전제로 한다.","개념"],
["윗글을 바탕으로 정보 윤리의 과제로 가장 적절한 것은?","정보 환경에서 다양한 존재가 서로 미치는 영향을 고려해 책임과 보호의 범위를 검토하는 것이다.","정보적 관계망 전체를 고려하는 윤리적 시각이 요구된다.","적용"],
["플로리디의 정보 철학에 대한 종합적 이해로 가장 적절한 것은?","현대 사회에서는 존재·관계·가치를 정보의 관점에서 함께 재검토할 필요가 있다고 본다.","인포스피어, 인포그, 내재적 가치 논의를 종합한 설명이다.","종합"]
]
},
{
id:"embedding",area:"독서 · 기술",title:"임베딩과 유사도 표현",
summary:"원-핫 인코딩의 한계, 저차원 벡터인 임베딩, 주변 문맥을 이용한 학습, 거리와 코사인 유사도의 해석을 중심으로 구성했습니다.",
source:"학교 학습지의 임베딩·유사도 표현 지문과 기존 대비 자료를 바탕으로 재구성했습니다.",
d:[
"원-핫 벡터는 단어 사이의 의미 유사성을 좌표 거리로 자연스럽게 반영한다.",
"어휘 수가 늘어도 원-핫 벡터의 차원 수는 일정하다.",
"임베딩은 모든 단어를 서로 직교하는 벡터로 고정한다.",

q:[
["원-핫 인코딩의 특징으로 가장 적절한 것은?","어휘 수만큼 차원이 커질 수 있으며 각 단어를 서로 구별하는 데는 유용하지만 의미적 유사성을 직접 나타내기 어렵다.","원-핫은 희소하고 고차원이며 의미 관계를 자연스럽게 반영하지 못한다.","개념"],
["임베딩을 사용하는 주된 이유로 가장 적절한 것은?","단어를 비교적 낮은 차원의 밀집 벡터로 나타내 의미 관계를 수치적으로 다루기 위해서이다.","임베딩은 의미적 관계를 벡터 공간에 반영하려는 표현 방식이다.","개념"],
["두 단어가 비슷한 문맥에서 자주 나타날 때 기대할 수 있는 결과로 적절한 것은?","학습된 임베딩 공간에서 두 단어의 벡터가 비슷한 방향이나 가까운 위치를 가질 가능성이 커진다.","분포적 문맥 정보가 벡터 관계에 반영된다.","추론"],
["원-핫 벡터와 임베딩 벡터를 비교한 것으로 적절한 것은?","원-핫은 주로 단어의 구별을, 임베딩은 단어 간 관계의 표현을 더 잘 지원한다.","두 표현의 기능적 차이를 묻는 문항이다.","비교"],
["유클리드 거리에 대한 설명으로 적절한 것은?","벡터 공간에서 두 점 사이의 직선거리를 나타내며 일반적으로 거리가 작을수록 가까운 표현으로 볼 수 있다.","유클리드 거리는 위치의 차이를 거리로 나타낸다.","개념"],
["코사인 유사도에 대한 설명으로 가장 적절한 것은?","두 벡터가 이루는 각도를 바탕으로 방향의 유사성을 측정한다.","벡터 크기보다 방향 관계를 중심으로 비교한다.","개념"],
["코사인 유사도가 1에 가까운 두 벡터에 대한 해석으로 적절한 것은?","두 벡터의 방향이 매우 비슷하다고 볼 수 있다.","코사인 값이 1에 가까울수록 방향 유사성이 높다.","적용"],
["<보기>에서 가장 적절한 해석은?\nA-B의 유클리드 거리=0.7, A-C의 유클리드 거리=3.1","거리 기준으로는 A와 B가 A와 C보다 더 가까운 표현이다.","유클리드 거리는 작은 쪽을 더 가깝게 본다.","자료"],
["<보기>에서 가장 적절한 해석은?\nD-E 코사인 유사도=0.92, D-F 코사인 유사도=0.21","방향 기준으로 D와 E의 표현이 D와 F보다 더 유사하다.","코사인 유사도 값이 큰 쪽이 방향이 더 비슷하다.","자료"],
["임베딩이 원-핫보다 의미 관계를 표현하기 쉬운 이유로 적절한 것은?","학습 과정에서 문맥상의 공통점과 차이가 벡터의 상대적 위치에 반영될 수 있기 때문이다.","벡터 좌표가 문맥 학습의 결과로 조정된다.","추론"],
["원-핫 인코딩의 차원 문제를 설명한 것으로 적절한 것은?","어휘가 매우 많아지면 벡터의 차원도 커져 표현이 비효율적일 수 있다.","어휘 크기와 차원 수가 직접 연결되는 점이 한계다.","세부"],
["임베딩에서 ‘밀집 벡터’라는 말의 의미로 적절한 것은?","상대적으로 적은 차원에 여러 실숫값이 들어가 정보를 분산해 표현한다는 뜻이다.","원-핫의 대부분 0인 희소 표현과 대비된다.","개념"],
["다음 중 임베딩 학습의 결과로 기대하기 어려운 것은?","의미가 비슷한 모든 단어가 철자 순서대로 같은 간격에 배치되는 것이다.","임베딩은 철자 순서가 아니라 학습된 문맥 관계를 반영한다.","판단",["의미가 비슷한 모든 단어가 철자 순서대로 같은 간격에 배치되는 것이다.","단어 임베딩은 문맥 정보와 무관하게 사전 순서만으로 결정된다.","임베딩은 모든 단어를 서로 직교하는 벡터로 고정한다.","임베딩의 목적은 단어의 철자 길이를 정확히 저장하는 것이다."]],
["‘왕-남자+여자≈여왕’과 같은 벡터 관계가 의미하는 바로 가장 적절한 것은?","임베딩 공간이 일부 의미 관계를 방향과 위치의 차이로 표현할 수 있음을 보여 준다.","벡터 연산이 의미적 관계를 일정 부분 포착하는 사례다.","적용"],
["코사인 유사도와 유클리드 거리를 함께 사용하는 이유로 적절한 것은?","벡터의 방향과 위치 차이라는 서로 다른 측면을 비교할 수 있기 때문이다.","두 지표는 같은 정보를 완전히 동일하게 측정하지 않는다.","비교"],
["두 벡터의 길이가 크게 달라도 코사인 유사도가 높을 수 있는 이유는?","코사인 유사도가 주로 두 벡터의 방향 관계를 보기 때문이다.","벡터의 크기가 달라도 방향이 비슷하면 코사인 값은 높을 수 있다.","추론"],
["임베딩 지문의 전개 방식으로 가장 적절한 것은?","기존 표현 방식의 한계를 제시한 뒤 대안적 표현 방식과 유사도 측정 방법을 설명한다.","원-핫의 한계→임베딩→거리·유사도라는 흐름이다.","구조"],
["<보기>의 판단으로 적절한 것은?\n두 단어가 원-핫으로 표현되었을 때 서로 다른 위치에 1을 가진다.","두 단어가 서로 다르다는 사실은 알 수 있지만 그 자체만으로 의미가 얼마나 비슷한지는 판단하기 어렵다.","원-핫은 식별에는 유용하지만 의미 유사도는 직접 표현하지 않는다.","적용"],
["임베딩에서 좌표 자체보다 중요한 것으로 적절한 것은?","다른 단어 벡터들과 맺는 상대적 거리와 방향 관계이다.","의미 해석은 상대적 위치 관계를 중심으로 이루어진다.","추론"],
["임베딩과 유사도 표현에 대한 종합적 이해로 가장 적절한 것은?","단어를 수치 벡터로 바꾸면 문맥에서 학습한 의미 관계를 거리나 각도 같은 수치로 비교할 수 있다.","지문의 핵심을 종합한 설명이다.","종합"]
]
},

q:[
["한옥의 구성 원리에 대한 설명으로 가장 적절한 것은?","구조적 안정과 시각적 조화를 함께 고려하여 기둥·공포·지붕을 구성한다.","학교 지문은 구조와 미감의 조화를 함께 강조한다.","주제"],
["배흘림기둥의 형태로 적절한 것은?","기둥의 중간 부분이 가장 굵고 위아래로 갈수록 가늘어지는 형태이다.","배흘림은 시각적 안정감과 관련해 설명된다.","개념"],
["민흘림기둥에 대한 설명으로 적절한 것은?","기둥의 위쪽이 아래쪽보다 조금 가늘어지는 형태이다.","배흘림과 구별되는 기둥 형태다.","개념"],
["귀솟음의 효과로 가장 적절한 것은?","건물의 모서리 쪽 기둥을 상대적으로 높여 처마선이 처져 보이는 것을 보정한다.","시각적 착시를 보완해 안정감을 준다.","구조"],
["공포의 역할로 적절한 것은?","지붕의 하중을 기둥에 전달하고 처마를 바깥으로 내밀 수 있게 돕는다.","공포는 구조적·미적 기능을 함께 갖는다.","개념"],
["주심포식의 특징으로 가장 적절한 것은?","공포를 주로 기둥 위에 배치하는 방식이다.","주심포식은 공포 위치가 기둥 위 중심이다.","비교"],
["다포식의 특징으로 가장 적절한 것은?","기둥 위뿐 아니라 기둥 사이에도 공포를 배치하여 공포 수가 많아질 수 있다.","다포식은 보다 촘촘한 공포 배열이 특징이다.","비교"],
["주심포식보다 다포식이 큰 지붕을 지탱하기에 유리한 이유로 적절한 것은?","여러 공포가 하중을 더 고르게 분산하는 데 도움을 줄 수 있기 때문이다.","공포의 분산 배치가 구조적 지지에 기여한다.","추론"],
["한옥의 처마를 길게 내민 것의 기능으로 가장 적절한 것은?","비와 햇빛을 조절하고 건물의 외관에 깊이와 리듬을 더하는 데 도움을 준다.","처마는 실용성과 미감을 함께 고려한다.","기능"],
["서까래의 끝부분이 높아지는 곡선이 주는 효과로 적절한 것은?","지붕이 실제보다 가볍고 상승하는 듯한 인상을 줄 수 있다.","곡선형 처마선은 한옥의 미적 특징이다.","미감"],
["한옥 지붕 곡선과 자연 환경의 관계로 적절한 것은?","주변 산세와 지형을 고려해 지붕선이 자연스럽게 조화를 이루도록 하였다.","전체적 조화와 비례를 중시한다.","추론"],
["<보기>를 한옥의 구성 원리에 적용한 것으로 적절한 것은?\n<보기> 건물 모서리의 처마가 중앙보다 시각적으로 처져 보인다.","모서리 기둥 높이를 조정하여 시각적 불안정을 보완하는 방안을 생각할 수 있다.","귀솟음의 원리를 적용할 수 있다.","적용"],
["<보기>의 건축물이 기둥 사이에도 공포를 여러 개 두었다면 어떤 양식에 가깝다고 볼 수 있는가?","다포식에 가깝다고 볼 수 있다.","공포가 기둥 사이에도 놓이는 것이 다포식의 핵심 특징이다.","적용"],
["한옥에서 목재의 자연스러운 형태를 완전히 반듯하게 만들지 않은 이유로 가장 적절한 것은?","재료가 지닌 본래의 성질과 전체 건물의 조화를 함께 살리려는 태도와 관련된다.","자연 재료를 과도하게 인공적으로 다듬지 않는 미감이 드러난다.","추론"],
["기둥의 높이와 굵기를 미세하게 달리하는 이유로 가장 적절한 것은?","실제 구조와 인간의 시각에서 느끼는 비례를 함께 조정하기 위해서이다.","한옥은 구조와 지각상의 균형을 동시에 고려한다.","추론"],
["공포를 구조적 요소이자 미적 요소라고 할 수 있는 이유로 적절한 것은?","하중을 전달하면서 반복된 짜임 자체가 장식적 리듬을 형성하기 때문이다.","기능과 장식이 분리되지 않는 사례다.","종합"],
["한옥의 아름다움에 대한 지문의 관점으로 가장 적절한 것은?","개별 요소의 화려함보다 요소 사이의 비례와 조화를 중요하게 본다.","구성 요소 간 조화가 핵심이다.","주제"],
["지문의 설명 방식으로 가장 적절한 것은?","한옥의 여러 구성 요소를 나누어 구조적 기능과 미적 효과를 함께 설명한다.","기둥·공포·지붕을 항목별로 설명한다.","구조"],
["한옥의 지붕과 기둥 관계에 대한 이해로 적절한 것은?","무거운 지붕의 하중을 기둥과 공포가 분담하면서 시각적 안정감을 만든다.","구조물 간 역할 관계를 묻는 문항이다.","관계"],
["한옥 지문을 종합해 이해한 것으로 가장 적절한 것은?","한옥은 자연 재료와 구조적 원리를 활용하여 안정성·비례·주변 환경과의 조화를 함께 추구한다.","전체 핵심을 종합한 설명이다.","종합"]
]
},
{
id:"poetry",area:"독서 · 현대시",title:"감상적 읽기 · 현대시 「꽃」·「누룩」",
summary:"이육사 「꽃」과 이성부 「누룩」의 시어·이미지·시상 전개·희망의 방식과 두 작품의 비교 감상을 중심으로 묻습니다.",
source:"학교 현대시 유인물과 기존 작품 해설을 바탕으로 구성했습니다.",

["「꽃」에서 ‘꽃’의 의미로 가장 적절한 것은?","부정적 현실을 넘어서는 생명력과 희망의 가능성을 상징한다.","꽃은 혹독한 현실 속에서도 피어날 미래의 생명력을 상징한다.","꽃"],

["「꽃」의 시상 전개를 설명한 것으로 적절한 것은?","극한의 현실 인식에서 출발하여 생명의 징후를 발견하고 마침내 미래의 존재를 부르는 방향으로 나아간다.","현실→기다림→호명의 흐름으로 희망이 강화된다.","꽃"],
["「꽃」의 화자 태도로 가장 적절한 것은?","암담한 현실을 직시하면서도 미래의 생명과 약속을 포기하지 않는다.","절망에 머무르지 않고 희망을 견지한다.","꽃"],

["「꽃」의 표현상 특징으로 적절한 것은?","자연 이미지와 상징적 시어를 통해 시대적 고통과 희망을 함께 형상화한다.","자연물은 현실과 미래에 대한 인식을 상징적으로 전달한다.","꽃"],
["「누룩」에서 ‘누룩 한 덩이’의 상징으로 가장 적절한 것은?","스스로 삭고 변하면서 다른 존재들과 함께 새로운 변화를 일으키는 존재이다.","누룩은 자기 변화를 통해 공동체적 발효를 가능하게 한다.","누룩"],
["「누룩」의 ‘죽어 썩어 문드러져’에 대한 이해로 적절한 것은?","단순한 파괴가 아니라 새로운 발효와 결실을 위한 자기희생의 과정으로 볼 수 있다.","소멸의 이미지가 생성의 조건으로 전환된다.","누룩"],

["「누룩」의 ‘여럿이서도 찾는 길’에 대한 이해로 적절한 것은?","개인의 탐색이 공동체적 지향으로 확장되는 모습을 보여 준다.","혼자에서 여럿으로 확장되는 흐름이 중요하다.","누룩"],

["15세기 자료가 중요한 이유로 적절한 것은?","순행적 유음화가 일반화되기 전부터 ‘ㄹ’ 탈락이 적용된 환경이 존재했음을 보여 주기 때문이다.","규칙의 역사적 선후 관계를 확인하는 근거다.","역사"],

["스포츠클럽 건의문의 수신자로 교장 선생님이 적절한 이유는?","학교 운영과 관련한 개선 방안을 검토하고 결정할 권한이 있기 때문이다.","수신자는 건의를 수용·실행할 수 있는 주체여야 한다.","독자"],

["‘활동 시간이 평일 방과 후로 한정됨’과 연결되는 해결 방안으로 적절한 것은?","학생들이 참여할 수 있도록 활동 시간대를 다양하게 운영하는 것이다.","문제 원인에 직접 대응하는 방안이다.","구조"],

["평가적 인용을 사용할 때 유의할 점으로 적절한 것은?","누가 어떤 맥락에서 평가했는지 분명히 하고 대상의 특징을 뒷받침하는 데 활용한다.","인용도 출처와 맥락이 중요하다.","자료"],
["<보기>의 정보를 초고에 추가하기 가장 적절한 위치는?\n‘5층에는 인상주의 작품을 집중적으로 감상할 수 있는 전시 공간이 있다.’","층별 공간 구성을 설명하는 부분에 보충 정보로 넣는다.","자료는 기존 문단의 중심 내용과 연결해 배치해야 한다.","적용"],
["표·그림·사진을 활용하는 이유로 적절한 것은?","글만으로 이해하기 어려운 공간·수치·형태 정보를 시각적으로 보완하기 위해서이다.","보조 자료는 독자의 이해를 도와야 한다.","표현"],
["정보 전달 글의 마무리로 적절한 것은?","앞서 설명한 핵심 특징을 간단히 정리하고 대상의 의미를 다시 환기한다.","마무리는 전체 내용을 정돈한다.","구조"],
["정보 전달 글쓰기에 대한 종합적 이해로 가장 적절한 것은?","목적과 독자를 고려해 신뢰할 수 있는 정보를 선별하고 적절한 구조와 표현 자료로 조직해야 한다.","선별·조직·표현의 전 과정을 종합한 설명이다.","종합"]
]
}
];

const chapterMap = Object.fromEntries(CHAPTERS.map(c=>[c.id,c]));
const KEY="bg2-midterm-quiz-v2";
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||{answers:{},wrongs:{},attempts:{}}}catch(e){state={answers:{},wrongs:{},attempts:{}}}
if(!state.answers)state.answers={};if(!state.wrongs)state.wrongs={};if(!state.attempts)state.attempts={};

function qid(ch,i){return ch.id+"-"+i}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function optionSet(ch,item,i){
  if(item[4]) return item[4].slice();
  const arr=[item[1]], pool=ch.d;
  let k=(i*3)%pool.length;
  while(arr.length<5){
    const x=pool[k%pool.length];k++;
    if(!arr.includes(x))arr.push(x);
  }
  const pos=(i*2+1)%5;
  const correct=arr.shift();
  arr.splice(pos,0,correct);
  return arr;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function chapterProgress(ch){
  let answered=0,correct=0;
  ch.q.forEach((it,i)=>{const a=state.answers[qid(ch,i)];if(a){answered++;if(a.correct)correct++;}});
  return {answered,correct};
}
let current=localStorage.getItem(KEY+"-chapter")||CHAPTERS[0].id;
if(!chapterMap[current])current=CHAPTERS[0].id;

function renderNav(){
 const el=document.getElementById("chapterList");el.innerHTML="";
 CHAPTERS.forEach((c,idx)=>{
   const p=chapterProgress(c);
   const b=document.createElement("button");b.className="chapter-btn"+(c.id===current?" active":"");
   b.innerHTML="<span>"+(idx+1)+".</span><span>"+esc(c.title)+"<small>"+esc(c.area)+" · "+p.answered+"/20</small></span>";
   b.onclick=()=>{current=c.id;localStorage.setItem(KEY+"-chapter",current);renderAll();window.scrollTo({top:0,behavior:"smooth"})};
   el.appendChild(b);
 });
}
function renderHead(){
 const c=chapterMap[current],p=chapterProgress(c),pct=Math.round(p.answered/20*100);
 document.getElementById("chapterHead").innerHTML=
 "<h2>"+esc(c.title)+"</h2>"+
 "<div class='meta'><span>"+esc(c.area)+"</span><span>20문항</span><span>정답 "+p.correct+" / 응답 "+p.answered+"</span></div>"+
 "<div class='summary'>"+esc(c.summary)+"</div>"+
 "<div class='source-note"+(c.warn?" warn":"")+"'>자료 기준: "+esc(c.source)+"</div>"+
 "<div class='progress'><div class='progress-line'><span>진행률</span><span>"+pct+"%</span></div><div class='bar'><span style='width:"+pct+"%'></span></div></div>";
}
function renderQuestions(){
 const c=chapterMap[current],box=document.getElementById("questions");box.innerHTML="";
 c.q.forEach((it,i)=>{
  const id=qid(c,i),options=optionSet(c,it,i),ans=state.answers[id];
  const card=document.createElement("section");card.className="qcard";card.id="q-"+id;
  let html="<div class='qtop'><span class='qnum'>"+String(i+1).padStart(2,"0")+"</span><span class='tag'>"+esc(it[3]||"수능형")+"</span></div>";
  html+="<div class='stem'>"+esc(it[0])+"</div><div class='choices'>";
  options.forEach((op,j)=>{
    let cls="choice";if(ans){cls+=" locked";if(op===it[1])cls+=" correct";if(op===ans.selected&&!ans.correct)cls+=" wrong";}
    html+="<label class='"+cls+"'><input type='radio' name='"+id+"' "+(ans&&ans.selected===op?"checked":"")+" "+(ans?"disabled":"")+" data-id='"+id+"' data-op='"+encodeURIComponent(op)+"'><span><b>"+["①","②","③","④","⑤"][j]+"</b> "+esc(op)+"</span></label>";
  });
  html+="</div>";
  if(ans){
   html+="<div class='feedback show "+(ans.correct?"good":"bad")+"'><b>"+(ans.correct?"정답입니다.":"오답입니다.")+"</b><br>정답: "+esc(it[1])+"<br>"+esc(it[2])+"<br><button class='retry' onclick='retryQuestion(\""+id+"\")'>이 문제 다시 풀기</button></div>";
  }else html+="<div class='feedback'></div>";
  card.innerHTML=html;box.appendChild(card);
 });
 box.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",onChoose));
}
function findQuestion(id){
 const [cid,idx]=id.split(/-(?=\d+$)/);const c=chapterMap[cid];return {c,i:Number(idx),it:c.q[Number(idx)]};
}
function onChoose(e){
 const id=e.target.dataset.id,op=decodeURIComponent(e.target.dataset.op),obj=findQuestion(id),correct=op===obj.it[1];
 state.answers[id]={selected:op,correct};state.attempts[id]=(state.attempts[id]||0)+1;
 if(correct){delete state.wrongs[id]}else{state.wrongs[id]={selected:op,chapter:obj.c.id,index:obj.i};}
 save();renderAll(false);
 setTimeout(()=>document.getElementById("q-"+id)?.scrollIntoView({block:"center"}),0);
}
function retryQuestion(id){
 delete state.answers[id];save();renderAll(false);
 setTimeout(()=>document.getElementById("q-"+id)?.scrollIntoView({block:"center",behavior:"smooth"}),0);
}
function renderWrong(){
 const list=document.getElementById("wrongList"),ids=Object.keys(state.wrongs);
 document.getElementById("wrongCount").textContent=ids.length;
 if(!ids.length){list.innerHTML="<div class='wrong-empty'>현재 남아 있는 오답이 없습니다. 틀린 문항은 자동으로 이곳에 모입니다.</div>";return;}
 list.innerHTML=ids.map(id=>{
   const w=state.wrongs[id],c=chapterMap[w.chapter],it=c.q[w.index];
   return "<div class='wrong-item'><strong>"+esc(c.title)+" · "+(w.index+1)+"번</strong>"+
   "<div>"+esc(it[0])+"</div><div class='wrong-answer'>내가 고른 답: "+esc(w.selected)+"</div>"+
   "<div class='right-answer'>정답: "+esc(it[1])+"</div><div>"+esc(it[2])+"</div>"+
   "<button class='jump' onclick='goWrong(\""+id+"\")'>다시 풀기</button></div>";
 }).join("");
}
function goWrong(id){
 const o=findQuestion(id);current=o.c.id;localStorage.setItem(KEY+"-chapter",current);delete state.answers[id];save();renderAll();
 setTimeout(()=>document.getElementById("q-"+id)?.scrollIntoView({block:"center",behavior:"smooth"}),50);
}
function resetAll(){
 if(!confirm("모든 풀이 기록과 오답노트를 초기화할까요?"))return;
 state={answers:{},wrongs:{},attempts:{}};save();renderAll();
}
function renderAll(){renderNav();renderHead();renderQuestions();renderWrong()}
renderAll();
</script>
</body>
</html>
